name: vscode

on:
  push:
    branches: [master]
    tags: ['vscode-v*']
  pull_request:
    paths: ['vscode/**', 'fixtures/**', '.github/workflows/vscode.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: vscode

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: Install jscpd
        shell: bash
        run: npm install -g jscpd@latest && jscpd --version
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Test (Linux needs a display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - name: Test
        if: runner.os != 'Linux'
        run: npm test

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
      - name: The tag must carry the version of package.json
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        run: |
          version=$(node -p "require('./package.json').version")
          test "vscode-v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} does not match package.json version $version"; exit 1; }
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: jscpd-vsix
          path: vscode/*.vsix

  # A tag vscode-v<version> publishes the package the previous job built,
  # to the Marketplace (VSCE_PAT) and to Open VSX (OVSX_PAT).
  publish:
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: jscpd-vsix
          path: vscode
      - name: Publish to the Marketplace
        run: npx vsce publish --packagePath ./*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX
        run: |
          npx ovsx create-namespace kucherenko --pat "$OVSX_PAT" || echo "namespace exists"
          npx ovsx publish ./*.vsix --pat "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
